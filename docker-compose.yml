services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    command: make backend-run
    container_name: spa_web
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    command: make frontend-run
    container_name: frontend-run
    restart: always
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  static:
  media:
